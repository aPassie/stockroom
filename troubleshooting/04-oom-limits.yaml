apiVersion: v1
kind: Pod
metadata:
  name: stockroom-backend-tiny
  namespace: stockroom
spec:
  containers:
    - name: backend
      image: ghcr.io/your-github-user/stockroom-backend:latest
      env:
        - name: RUN_MIGRATIONS
          value: "false"
      resources:
        limits:
          memory: 16Mi
