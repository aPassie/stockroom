apiVersion: v1
kind: Pod
metadata:
  name: stockroom-backend-debug
  namespace: stockroom
  labels:
    app: backend-debug
spec:
  containers:
    - name: backend
      image: ghcr.io/your-github-user/stockroom-backend:latest
      env:
        - name: DATABASE_URL
          value: postgresql+psycopg://stockroom:change-me@postgres:5432/stockroom
      readinessProbe:
        httpGet:
          path: /ready
          port: 8000
