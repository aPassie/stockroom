apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stockroom.name" . }}-db
  labels:
    {{- include "stockroom.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  {{- if .Values.externalDatabaseUrl }}
  DATABASE_URL: {{ .Values.externalDatabaseUrl | quote }}
  {{- else }}
  DATABASE_URL: "postgresql+psycopg://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ include "stockroom.postgresHost" . }}:5432/{{ .Values.postgres.database }}"
  {{- end }}
