imagePullSecrets: []

backend:
  image:
    repository: ghcr.io/your-github-user/stockroom-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 384Mi }

frontend:
  image:
    repository: ghcr.io/your-github-user/stockroom-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

postgres:
  enabled: true
  image: postgres:16-alpine
  database: stockroom
  username: stockroom
  password: change-me
  storage: 5Gi
  storageClass: ""

externalDatabaseUrl: ""

ingress:
  enabled: true
  className: nginx
  host: stockroom.local
  annotations: {}
  tls: false

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  cpuUtilization: 60

monitoring:
  serviceMonitor: true
  dashboard: true
  releaseLabel: kube-prometheus-stack
